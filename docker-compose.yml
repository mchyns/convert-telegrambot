version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: docpdf_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docpdf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-docpdf}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docpdf}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: docpdf_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  telegram-bot:
    build:
      context: .
      dockerfile: docker/bot.Dockerfile
    container_name: docpdf_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-docpdf}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-docpdf}
      - REDIS_URL=redis://redis:6379/0
      - USE_REDIS_QUEUE=true
      - TEMP_DIR=/tmp/docpdf
    volumes:
      - temp_storage:/tmp/docpdf
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: docpdf_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-docpdf}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-docpdf}
      - REDIS_URL=redis://redis:6379/0
      - USE_REDIS_QUEUE=true
      - TEMP_DIR=/tmp/docpdf
    volumes:
      - temp_storage:/tmp/docpdf
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  temp_storage:
